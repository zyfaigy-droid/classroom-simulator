<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安K模拟器</title>
  <link rel="stylesheet" href="assets/game.css">
</head>
<body>
  <main class="stage">
    <aside class="side" aria-label="玩家状态">
      <section class="brand">
        <div class="portrait is-photo" aria-hidden="true">
          <img src="安K粉头盔.jpg" alt="">
          <div class="hair"></div>
          <div class="face"></div>
        </div>
        <div>
          <h1>安K模拟器</h1>
          <div class="subtitle">粉色头盔、晃表发光、教室生存</div>
        </div>
      </section>

      <section class="meter" aria-label="状态条">
        <div class="meter-row">
          <span>理智</span>
          <div class="bar"><div class="fill" id="mindBar"></div></div>
          <span id="mindValue">72</span>
        </div>
        <div class="meter-row">
          <span>钱包</span>
          <div class="bar"><div class="fill" id="moneyBar"></div></div>
          <span id="moneyValue">520</span>
        </div>
        <div class="meter-row">
          <span>尊严</span>
          <div class="bar"><div class="fill" id="dignityBar"></div></div>
          <span id="dignityValue">65</span>
        </div>
      </section>

      <section class="inventory">
        <p class="inventory-title">书包里的东西</p>
        <div class="tags" id="tags"></div>
      </section>

      <section class="inventory">
        <p class="inventory-title">隐藏成就</p>
        <div class="tags" id="achievements"></div>
      </section>

      <button class="loan-control" id="loanBtn" type="button">助学贷款（钱包 <= 100）</button>
      <button class="music-control" id="musicBtn" type="button">播放 BGM</button>
      <audio id="bgm" src="巴啦啦K魔仙.mp3" preload="none" loop></audio>
      <button class="reset" id="resetBtn" type="button">重新开局</button>
      <button class="clear-save" id="clearSaveBtn" type="button">清空存档</button>
      <div class="tip">⚠️ 本游戏纯属虚构，角色与事件均为艺术创作，不指向任何现实个人。人物照片为 AI 生成，非真实肖像。如有雷同，纯属巧合。</div>
    </aside>

    <section class="main">
      <div class="classroom" aria-hidden="true">
        <div class="photo-board">
          <img src="安K课堂实拍.jpg" alt="">
        </div>
        <div class="board">
          <div class="board-title" id="boardTitle">今日重点：先抬头</div>
          <div class="board-line"></div>
          <div class="board-line" style="width: 72%"></div>
          <div class="board-line" style="width: 48%"></div>
        </div>
        <div class="student-row">
          <div class="student"></div>
          <div class="student"></div>
          <div class="student"></div>
          <div class="student"></div>
        </div>
        <div class="teacher">
          <div class="cap"></div>
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left-arm"><div class="watch"></div></div>
          <div class="arm right-arm"></div>
        </div>
        <div class="desk"></div>
      </div>

      <div class="panel">
        <div class="scene-head">
          <h2 class="scene-title" id="sceneTitle">转学第一天</h2>
          <div class="day-pill" id="dayPill">第 1 节</div>
        </div>
        <article class="story" id="story"></article>
        <div class="story-photo">
          <img id="storyImage" src="安K课堂实拍.jpg" alt="">
          <span id="photoCaption">真实课堂照片已加入游戏元素：晃表、讲台和大屏会跟剧情一起形成画面感。</span>
        </div>
        <div class="choices" id="choices"></div>
      </div>
    </section>
  </main>

  <div class="reader-backdrop" id="readerBackdrop" aria-hidden="true">
    <section class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <div class="reader-head">
        <h2 class="reader-title" id="readerTitle">学长作品</h2>
        <button class="reader-close" id="readerClose" type="button">关闭</button>
      </div>
      <div class="reader-body" id="readerBody" tabindex="0"></div>
    </section>
  </div>

  <script src="assets/story-classic.js"></script>
  <script src="assets/game.js"></script>
</body>
</html>
