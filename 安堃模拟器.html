<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安K模拟器</title>
  <style>
    :root {
      --ink: #171717;
      --paper: #f7f1df;
      --chalk: #eff7ef;
      --board: #24473e;
      --board-deep: #163229;
      --gold: #d49a2c;
      --red: #c94f43;
      --blue: #2f6f9f;
      --green: #5c8d58;
      --shadow: rgba(20, 20, 20, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(180deg, #c6d7ca 0%, #e7d4aa 64%, #b78355 64%, #8f5f42 100%);
      overflow-x: hidden;
    }

    .stage {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(250px, 330px) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .side,
    .main {
      border: 3px solid #2a2116;
      box-shadow: 0 12px 0 rgba(42, 33, 22, 0.32);
      background: var(--paper);
    }

    .side {
      min-height: calc(100vh - 36px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 12px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px dashed #7a6242;
    }

    .portrait {
      width: 70px;
      height: 70px;
      border: 3px solid #2a2116;
      background: #f2c68f;
      position: relative;
      overflow: hidden;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 48% 34%;
      display: block;
      filter: saturate(1.04) contrast(1.03);
    }

    .portrait.is-photo::before,
    .portrait.is-photo::after,
    .portrait.is-photo .hair,
    .portrait.is-photo .face {
      display: none;
    }

    .portrait::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 8px;
      width: 42px;
      height: 46px;
      border-radius: 50% 50% 44% 44%;
      background: #f1b57a;
      box-shadow: inset 0 -8px rgba(160, 83, 50, 0.16);
    }

    .portrait::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -18px;
      height: 42px;
      border-radius: 20px 20px 0 0;
      background: #213d65;
    }

    .hair {
      position: absolute;
      left: 9px;
      top: 4px;
      width: 52px;
      height: 25px;
      background: #e49bb4;
      border-radius: 18px 18px 8px 8px;
      z-index: 2;
    }

    .face {
      position: absolute;
      z-index: 3;
      left: 24px;
      top: 29px;
      width: 22px;
      height: 9px;
      border-top: 3px solid #321;
      border-bottom: 3px solid #321;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 12px;
      color: #765f40;
    }

    .meter {
      display: grid;
      gap: 8px;
      padding: 10px;
      background: #fff8e9;
      border: 2px solid #4f422f;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 56px 1fr 36px;
      gap: 8px;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .bar {
      height: 14px;
      border: 2px solid #2a2116;
      background: #e5dac2;
      overflow: hidden;
    }

    .fill {
      width: 50%;
      height: 100%;
      background: var(--green);
      transition: width 220ms ease, background 220ms ease;
    }

    .inventory {
      flex: 1;
      min-height: 120px;
      max-height: 230px;
      background: #fff8e9;
      border: 2px solid #4f422f;
      padding: 10px;
      overflow-y: auto;
      scrollbar-color: #bd7e2a #fff8e9;
      scrollbar-width: thin;
    }

    .inventory-title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-content: flex-start;
    }

    .tag {
      padding: 5px 7px;
      border: 2px solid #2a2116;
      background: #e6eef1;
      font-size: 12px;
      font-weight: 700;
    }

    button.tag {
      color: #2a2116;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
      box-shadow: none;
    }

    button.tag:hover {
      background: #ffd45c;
      transform: none;
      box-shadow: none;
    }

    .tip {
      font-size: 12px;
      line-height: 1.6;
      color: #69543b;
    }

    .main {
      min-height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: 300px minmax(0, 1fr);
      overflow: hidden;
    }

    .classroom {
      position: relative;
      background:
        linear-gradient(180deg, transparent 0 70%, rgba(65, 45, 28, 0.24) 70%),
        linear-gradient(90deg, #c6d6c4 0%, #e9d8b4 100%);
      border-bottom: 3px solid #2a2116;
      overflow: hidden;
    }

    .photo-board {
      position: absolute;
      right: 34px;
      top: 22px;
      width: 240px;
      height: 150px;
      border: 6px solid #f7f1df;
      outline: 3px solid #2a2116;
      background: #ddd;
      box-shadow: 7px 8px 0 rgba(42, 33, 22, 0.32);
      transform: rotate(1.5deg);
      overflow: hidden;
      z-index: 1;
    }

    .photo-board img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 48% 42%;
      display: block;
    }

    .photo-board::after {
      content: "课堂实拍";
      position: absolute;
      left: 8px;
      bottom: 7px;
      padding: 4px 6px;
      border: 2px solid #2a2116;
      background: rgba(247, 241, 223, 0.9);
      font-size: 12px;
      font-weight: 800;
    }

    .board {
      position: absolute;
      left: 32px;
      top: 28px;
      width: min(57%, 560px);
      height: 180px;
      border: 8px solid #815d32;
      background:
        linear-gradient(0deg, rgba(255,255,255,0.05), rgba(255,255,255,0)),
        var(--board);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.32);
      color: var(--chalk);
      padding: 18px;
      font-family: "KaiTi", "FangSong", serif;
    }

    .board-title {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .board-line {
      height: 14px;
      margin: 10px 0;
      background: rgba(239, 247, 239, 0.36);
    }

    .desk {
      position: absolute;
      width: 180px;
      height: 70px;
      right: 34px;
      bottom: 18px;
      border: 3px solid #2a2116;
      background: #9d6b3d;
      box-shadow: 0 16px 0 #684121;
    }

    .teacher {
      position: absolute;
      right: 82px;
      top: 72px;
      width: 120px;
      height: 180px;
      z-index: 3;
    }

    .teacher .head {
      position: absolute;
      left: 38px;
      top: 0;
      width: 58px;
      height: 66px;
      border: 3px solid #2a2116;
      border-radius: 28px 28px 22px 22px;
      background: #efb17b;
      z-index: 3;
    }

    .teacher .cap {
      position: absolute;
      left: 27px;
      top: -10px;
      width: 80px;
      height: 30px;
      border: 3px solid #2a2116;
      background: #e9a6c3;
      border-radius: 18px 18px 6px 6px;
      z-index: 4;
    }

    .teacher .body {
      position: absolute;
      left: 28px;
      top: 60px;
      width: 78px;
      height: 92px;
      border: 3px solid #2a2116;
      background: #263f69;
      z-index: 2;
    }

    .teacher .body::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 24px;
      width: 34px;
      height: 14px;
      border-left: 5px solid #fff8e9;
      border-bottom: 5px solid #fff8e9;
      border-radius: 0 0 0 14px;
      transform: rotate(-24deg) skewX(-22deg);
      transform-origin: left bottom;
    }

    .teacher .arm {
      position: absolute;
      top: 80px;
      width: 58px;
      height: 18px;
      border: 3px solid #2a2116;
      background: #efb17b;
      z-index: 5;
    }

    .teacher .left-arm {
      left: 0;
      transform: rotate(-18deg);
    }

    .teacher .right-arm {
      right: -6px;
      transform: rotate(20deg);
    }

    .watch {
      position: absolute;
      left: 6px;
      top: -8px;
      width: 22px;
      height: 22px;
      border: 3px solid #2a2116;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8b3, var(--gold) 45%, #8f6119 70%);
      animation: glint 1.8s infinite ease-in-out;
    }

    @keyframes glint {
      0%, 100% { filter: brightness(1); transform: scale(1); }
      45% { filter: brightness(1.8); transform: scale(1.12); }
    }

    .student-row {
      position: absolute;
      left: 36px;
      right: 300px;
      bottom: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .student {
      height: 54px;
      border: 3px solid #2a2116;
      background: #c08348;
      position: relative;
    }

    .student::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -30px;
      width: 34px;
      height: 34px;
      transform: translateX(-50%);
      border: 3px solid #2a2116;
      border-radius: 50%;
      background: #e2aa78;
    }

    .panel {
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      min-height: 0;
      background:
        linear-gradient(90deg, rgba(120, 98, 58, 0.1) 1px, transparent 1px) 0 0 / 28px 28px,
        #fbf4e4;
    }

    .scene-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .scene-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .day-pill {
      border: 2px solid #2a2116;
      background: #f3cc76;
      padding: 6px 9px;
      font-size: 13px;
      font-weight: 800;
    }

    .story {
      min-height: 170px;
      border: 2px solid #4f422f;
      background: rgba(255, 255, 255, 0.54);
      padding: 14px;
      line-height: 1.72;
      font-size: 16px;
      overflow: auto;
    }

    .story.letter-story {
      background:
        radial-gradient(circle at 18px 18px, rgba(255, 212, 92, 0.38) 0 5px, transparent 6px),
        linear-gradient(#fffdf6, #fff2d6);
      border: 3px solid #2a2116;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.58);
      padding: 18px;
    }

    .letter-paper {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 22px 18px;
      border: 3px solid #2a2116;
      border-radius: 8px;
      background:
        linear-gradient(transparent 31px, rgba(71, 126, 166, 0.18) 32px) 0 0 / 100% 32px,
        #fffaf0;
      box-shadow: 8px 8px 0 rgba(42, 33, 22, 0.16);
    }

    .letter-paper::before {
      content: "全局通关信";
      position: absolute;
      right: 16px;
      top: 14px;
      border: 2px solid #2a2116;
      border-radius: 6px;
      background: #ff7f64;
      color: #2a2116;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 900;
      transform: rotate(4deg);
    }

    .letter-paper::after {
      content: "";
      position: absolute;
      left: 16px;
      top: 16px;
      width: 44px;
      height: 28px;
      border: 3px solid #2a2116;
      border-radius: 6px;
      background:
        linear-gradient(34deg, transparent 45%, #2a2116 46% 52%, transparent 53%),
        linear-gradient(-34deg, transparent 45%, #2a2116 46% 52%, transparent 53%),
        #9dd4ff;
    }

    .letter-title {
      margin: 0 88px 16px 54px;
      font-size: 22px;
      line-height: 1.2;
      color: #2a2116;
    }

    .letter-salute {
      margin: 0 0 14px;
      font-weight: 900;
    }

    .letter-section {
      margin: 0 0 16px;
      padding: 12px 12px 10px;
      border: 2px solid rgba(42, 33, 22, 0.24);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.56);
    }

    .letter-section h3 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #9b332b;
    }

    .letter-section p,
    .letter-intro,
    .letter-signature p {
      margin: 0 0 9px;
    }

    .letter-signature {
      margin-top: 18px;
      text-align: right;
      font-weight: 900;
    }

    .story-photo {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border: 2px solid #4f422f;
      background: rgba(255, 248, 233, 0.84);
    }

    .story-photo img {
      width: 140px;
      height: 88px;
      object-fit: cover;
      object-position: 48% 42%;
      border: 3px solid #2a2116;
      display: block;
    }

    .story-photo span {
      line-height: 1.55;
      font-size: 14px;
      font-weight: 700;
      color: #5b462d;
    }

    .reader-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(42, 33, 22, 0.54);
    }

    .reader-backdrop.is-open {
      display: flex;
    }

    .reader {
      width: min(900px, 96vw);
      max-height: 88vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 4px solid #2a2116;
      border-radius: 8px;
      background: #fff8e9;
      box-shadow: 0 14px 0 rgba(42, 33, 22, 0.32);
    }

    .reader-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      color: #2a2116;
      background:
        linear-gradient(90deg, #ffd45c 0 28%, #9edbd1 28% 56%, #f3a1bb 56% 78%, #c9dc6a 78%);
      border-bottom: 4px solid #2a2116;
    }

    .reader-title {
      margin: 0;
      font-size: clamp(18px, 3vw, 26px);
      letter-spacing: 0;
    }

    .reader-close {
      min-width: 44px;
      min-height: 40px;
      padding: 6px 10px;
      text-align: center;
      background: #fff8e9;
    }

    .reader-body {
      min-height: 360px;
      overflow: auto;
      padding: 16px;
      background:
        linear-gradient(135deg, rgba(255, 212, 92, 0.18), transparent 34%),
        linear-gradient(225deg, rgba(158, 219, 209, 0.2), transparent 42%),
        #fff8e9;
    }

    .reader-body iframe,
    .reader-body img {
      width: 100%;
      min-height: 58vh;
      border: 3px solid #2a2116;
      background: #fff;
    }

    .reader-body img {
      height: auto;
      min-height: 0;
      display: block;
      object-fit: contain;
    }

    .reader-text {
      white-space: pre-wrap;
      margin: 0;
      padding: 16px;
      border: 3px dashed #2a2116;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      color: #2a2116;
      font: 700 15px/1.7 "Microsoft YaHei", system-ui, sans-serif;
    }

    .story strong {
      color: #9b332b;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-height: 58px;
      border: 3px solid #2a2116;
      color: var(--ink);
      background: #e9f0dc;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
      padding: 10px 12px;
      box-shadow: 0 5px 0 #2a2116;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #fff1b4;
      transform: translateY(2px);
      box-shadow: 0 3px 0 #2a2116;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: none;
    }

    .reset {
      width: 100%;
      min-height: 48px;
      text-align: center;
      background: #f2d8d3;
    }

    .clear-save {
      width: 100%;
      min-height: 42px;
      text-align: center;
      background: #fff3cf;
      font-size: 14px;
    }

    .music-control {
      width: 100%;
      min-height: 48px;
      text-align: center;
      background: #d9e8ef;
    }

    .loan-control {
      width: 100%;
      min-height: 48px;
      text-align: center;
      background: #e9f0dc;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: 0 5px 0 #2a2116;
    }

    button:disabled:hover {
      background: #e9f0dc;
      transform: none;
      box-shadow: 0 5px 0 #2a2116;
    }

    .ending-good {
      background: #dcebd6;
    }

    .ending-bad {
      background: #f0d0cc;
    }

    .ending-weird {
      background: #d9e8ef;
    }

    @media (max-width: 840px) {
      .stage {
        grid-template-columns: 1fr;
      }

      .side,
      .main {
        min-height: auto;
      }

      .main {
        grid-template-rows: 260px auto;
      }

      .board {
        left: 16px;
        top: 18px;
        width: calc(100% - 150px);
        height: 150px;
        padding: 12px;
      }

      .teacher {
        right: 12px;
        transform: scale(0.82);
        transform-origin: top right;
      }

      .photo-board {
        right: 12px;
        top: 20px;
        width: 130px;
        height: 90px;
      }

      .desk {
        right: 12px;
        width: 126px;
      }

      .student-row {
        left: 16px;
        right: 150px;
        grid-template-columns: repeat(2, 1fr);
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .story-photo {
        grid-template-columns: 1fr;
      }

      .story-photo img {
        width: 100%;
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <aside class="side" aria-label="玩家状态">
      <section class="brand">
        <div class="portrait is-photo" aria-hidden="true">
          <img src="安K粉头盔.jpg" alt="">
          <div class="hair"></div>
          <div class="face"></div>
        </div>
        <div>
          <h1>安K模拟器</h1>
          <div class="subtitle">粉色头盔、晃表发光、教室生存</div>
        </div>
      </section>

      <section class="meter" aria-label="状态条">
        <div class="meter-row">
          <span>理智</span>
          <div class="bar"><div class="fill" id="mindBar"></div></div>
          <span id="mindValue">72</span>
        </div>
        <div class="meter-row">
          <span>钱包</span>
          <div class="bar"><div class="fill" id="moneyBar"></div></div>
          <span id="moneyValue">520</span>
        </div>
        <div class="meter-row">
          <span>尊严</span>
          <div class="bar"><div class="fill" id="dignityBar"></div></div>
          <span id="dignityValue">65</span>
        </div>
      </section>

      <section class="inventory">
        <p class="inventory-title">书包里的东西</p>
        <div class="tags" id="tags"></div>
      </section>

      <section class="inventory">
        <p class="inventory-title">隐藏成就</p>
        <div class="tags" id="achievements"></div>
      </section>

      <button class="loan-control" id="loanBtn" type="button">助学贷款（钱包 <= 100）</button>
      <button class="music-control" id="musicBtn" type="button">播放 BGM</button>
      <audio id="bgm" src="巴啦啦K魔仙.mp3" preload="auto" loop></audio>
      <button class="reset" id="resetBtn" type="button">重新开局</button>
      <button class="clear-save" id="clearSaveBtn" type="button">清空存档</button>
      <div class="tip">⚠️ 本游戏纯属虚构，角色与事件均为艺术创作，不指向任何现实个人。人物照片为 AI 生成，非真实肖像。如有雷同，纯属巧合。</div>
    </aside>

    <section class="main">
      <div class="classroom" aria-hidden="true">
        <div class="photo-board">
          <img src="安K课堂实拍.jpg" alt="">
        </div>
        <div class="board">
          <div class="board-title" id="boardTitle">今日重点：先抬头</div>
          <div class="board-line"></div>
          <div class="board-line" style="width: 72%"></div>
          <div class="board-line" style="width: 48%"></div>
        </div>
        <div class="student-row">
          <div class="student"></div>
          <div class="student"></div>
          <div class="student"></div>
          <div class="student"></div>
        </div>
        <div class="teacher">
          <div class="cap"></div>
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left-arm"><div class="watch"></div></div>
          <div class="arm right-arm"></div>

      const text = `${label} ${item}`;

      if (scene === "corridor") state.corridorHelmet += 1;
      if (/记录|录音|截图|材料|质询|证据|反馈/.test(text)) state.evidence += 1;
      if (/举手|拒绝|依据|为什么|您手上|地球人也需要规则/.test(text)) state.rebuttals += 1;
      if (/交|付款|办卡|补上/.test(text)) state.paidTimes += 1;
      if (/沉默|低头|骂|训话|站/.test(text)) state.scolded += 1;
      if (/金表|手表|戴表|表盘|反光/.test(text) || scene === "monitorFee") state.glare += 1;
      if ((scene === "midtermDrama" || scene === "roast") && /认真听/.test(label)) state.listenedRoast += 1;
      if ((scene === "math" || scene === "solve") && /放|低头|自己写|自己把课补/.test(label)) state.skippedQuestions += 1;

      updateAchievements();
    }

    function updateAchievements() {
      if (state.corridorHelmet >= 3) unlockAchievement("骚粉骑士");
      if (state.scolded >= 10) unlockAchievement("你可蠢");
      if (state.skippedQuestions >= 3) unlockAchievement("这一题先放一放");
      if (state.glare >= 10) unlockAchievement("金表眩晕");
      if (state.rebuttals >= 3 && state.items.some((item) => /期末|双表|勇气|质询/.test(item))) unlockAchievement("地球人之怒");
      if (state.evidence >= 6) unlockAchievement("小猿搜题大师");
      if (state.items.some((item) => /稳龙好感/.test(item))) unlockAchievement("稳龙好感");
      if (state.items.some((item) => /证据flag|录音证据/.test(item))) unlockAchievement("补课证据链");
      if (state.items.some((item) => /举报flag/.test(item))) unlockAchievement("礼物举报线");
      if (state.items.some((item) => /彩蛋解锁/.test(item))) unlockAchievement("装备彩蛋");
      if (state.items.some((item) => /学长作品/.test(item))) unlockAchievement("学长遗迹");
      if (state.items.filter((item) => /学长作品/.test(item)).length >= 8) unlockAchievement("成角考古家");
    }

    function recordEnding(sceneId) {
      const achievementName = endingAchievementNames[sceneId];
      if (achievementName) unlockAchievement(achievementName);
      if (globalCompletionEndingIds.includes(sceneId)) {
        uniquePushTo(permanentEndings, sceneId);
        saveProgress();
      }
    }

    function hasGlobalCompletion() {
      const endingsComplete = globalCompletionEndingIds.every((sceneId) => permanentEndings.includes(sceneId));
      const hasAchievementOrAlias = (name) => {
        const names = [name, ...(completionAchievementAliases[name] || [])];
        return names.some((entry) => permanentAchievements.includes(entry) || state.achievements.includes(entry));
      };
      const achievementsComplete = completionAchievementNames.every(hasAchievementOrAlias);
      return endingsComplete || achievementsComplete;
    }

    function hasKeyEvidence() {
      return state.items.some((item) => /期末材料包|联合反馈|录音|录像|截图|证据flag|举报flag|录音证据/.test(item));
    }

    function graduationEnding() {
      updateAchievements();
      const evidenceItems = state.items.filter((item) => /安K|稳龙|梓豪|录音|录像|证据|记录|材料|反馈|质询/.test(item)).length;
      const knightItems = state.items.filter((item) => /粉盔|电瓶车|骚粉|安K拳|推拉扯|稳龙|梓豪|医务室|他龙/.test(item)).length;
      const askedForBasis = state.items.some((item) => /期末质询/.test(item));
      const hasFormalReport = state.items.some((item) => /期末材料包|联合反馈|举报flag|录音证据/.test(item));
      const hasStrongEvidence = hasKeyEvidence() && (state.evidence >= 6 || evidenceItems >= 5);
      const hasEvidenceBurst = hasFormalReport || (hasStrongEvidence && state.rebuttals >= 3);
      const hasCharmMarker = state.items.some((item) => /期末质询|收费依据|反击|质疑|勇气|提前离场|最后白眼|双表|当场补充事实/.test(item));
      const hasCharmSeed = (askedForBasis && state.rebuttals >= 3 && state.dignity >= 55) || (hasCharmMarker && state.rebuttals >= 3 && state.dignity >= 55);
      const hasStableEarthSeed = !askedForBasis && !hasFormalReport && state.rebuttals <= 2 && state.mind >= 55 && state.money >= 100 && state.dignity >= 50;
      const hasMirrorSeed = (state.glare >= 5 && state.paidTimes >= 2) || (state.paidTimes >= 3 && state.scolded >= 3);
      const hasSubmissionSeed = state.rebuttals <= 1 && (
        (state.paidTimes >= 4 && state.dignity <= 70) ||
        (state.paidTimes >= 3 && state.dignity <= 55 && state.mind <= 65)
      );
      const hasThroatSeed = state.rebuttals <= 2 && (
        (knightItems >= 3 && state.scolded >= 4) ||
        (knightItems >= 2 && state.corridorHelmet >= 3 && state.scolded >= 3)
      );
      if (state.money <= 40 || (state.money <= 120 && state.paidTimes >= 3)) return "finalBadMoney";
      if (hasSubmissionSeed) return "finalShake";
      if (state.mind <= 25 || (state.mind <= 45 && state.scolded >= 7 && state.paidTimes < 2)) return "finalBadMind";
      if (hasEvidenceBurst) return "finalDayday";
      if (hasThroatSeed) return "finalThroat";
      if (hasStableEarthSeed) return "finalEarth";
      if (hasCharmSeed) return "finalCharm";
      if (state.rebuttals >= 3 && state.dignity >= 45 && state.money <= 180) return "finalCharm";
      if (hasMirrorSeed) return "finalMirror";
      if (state.dignity <= 45) return "finalBadDignity";
      if (state.paidTimes >= 3 && state.rebuttals <= 1 && state.dignity <= 55) return "finalShake";
      if (state.rebuttals >= 3 && state.dignity >= 50) return "finalCharm";
      if (state.mind >= 65 && state.money >= 100 && state.dignity >= 55) return "finalEarth";
      return "finalEarth";
    }

    function barColor(value) {
      if (value < 25) return "var(--red)";
      if (value < 55) return "var(--gold)";
      return "var(--green)";
    }

    function updateStats() {
      const stats = [
        ["mind", 100],
        ["money", 600],
        ["dignity", 100]
      ];

      stats.forEach(([key, max]) => {
        const value = state[key];
        const bar = document.getElementById(`${key}Bar`);
        document.getElementById(`${key}Value`).textContent = value;
        bar.style.width = `${clamp(value / max * 100, 0, 100)}%`;
        bar.style.background = barColor(value);
      });

      tagsEl.innerHTML = "";
      const items = state.items.length ? state.items : ["空书包", "半截铅笔", "求生直觉"];
      items.forEach((item) => {
        const file = workFilesByItem[item];
        const tag = document.createElement(file ? "button" : "span");
        tag.className = "tag";
        tag.textContent = item;
        if (file) {
          tag.type = "button";
          tag.title = "点击查看作品/档案";
          tag.addEventListener("click", () => openReader(file));
        }
        tagsEl.appendChild(tag);
      });

      achievementsEl.innerHTML = "";
      const mergedAchievements = [...new Set([...permanentAchievements, ...state.achievements])];
      const achievements = mergedAchievements.length ? mergedAchievements : ["尚未解锁"];
      achievements.forEach((achievement) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = achievement;
        tag.title = achievementDescriptions[achievement] || "这个成就来自本局的特殊选择与收集路线。";
        tag.setAttribute("aria-label", `${achievement}：${tag.title}`);
        achievementsEl.appendChild(tag);
      });

      const canUseLoan = state.money <= 100 && !state.loanUsed && !scenes[state.scene]?.ending;
      loanBtn.disabled = !canUseLoan;
      if (state.loanUsed) {
        loanBtn.textContent = "助学贷款已使用";
      } else if (state.money <= 100) {
        loanBtn.textContent = "申请助学贷款";
      } else {
        loanBtn.textContent = "助学贷款（钱包 <= 100）";
      }
    }

    function checkEnding() {
      if (state.day >= 8 && state.mind <= 0) return "finalBadMind";
      if (state.day >= 8 && state.money <= 0 && state.loanUsed) return "finalBadMoney";
      if (state.day >= 8 && state.dignity <= 0) return "finalBadDignity";
      const hasRadar = state.items.includes("表盘雷达");
      const hasNotes = state.items.filter((item) => item.includes("记录") || item.includes("线索")).length >= 3;
      if (!state.radarEndingSeen && hasRadar && hasNotes && state.glare >= 5 && state.day >= 10 && state.dignity >= 65) return "finalWeird";
      return "";
    }

    function render(sceneId) {
      state.corridorVisited ||= [];
      state.visitedScenes ||= [];
      const forcedEnding = checkEnding();
      const nextSceneId = forcedEnding && !scenes[sceneId]?.ending ? forcedEnding : sceneId;
      const scene = scenes[nextSceneId];
      state.scene = nextSceneId;
      if (!isRepeatableScene(nextSceneId)) uniquePushTo(state.visitedScenes, nextSceneId);
      if (nextSceneId === "finalWeird") state.radarEndingSeen = true;
      if (scene.ending) recordEnding(nextSceneId);

      sceneTitleEl.textContent = scene.title;
      boardTitleEl.textContent = scene.board || "今日重点";
      dayPillEl.textContent = scene.ending ? "结局" : `第 ${state.day} 节`;
      let storyText = scene.text;
      if (nextSceneId === "fee" && state.items.includes("贫困生")) {
        storyText += "\n\n安K扫了一眼你的申请记录，又补了一句：“贷款还不还？别到时候又说自己困难。”";
      }
      if (nextSceneId === "finalEarth" && state.loanUsed && state.money >= 100) {
        storyText += "\n\n你后来还清了那 300 块。不是还给他，是还给自己。";
      }
      storyEl.classList.toggle("letter-story", nextSceneId === "seniorBlessing");
      if (nextSceneId === "seniorBlessing") {
        storyEl.innerHTML = renderSeniorLetter();
      } else {
        storyEl.textContent = storyText;
      }
      storyImageEl.src = scene.image || "安K课堂实拍.jpg";
      storyImageEl.alt = scene.image ? scene.title : "";
      photoCaptionEl.textContent = scene.photo || "课堂实拍：安K在讲台前指向大屏，晃表反光与公式共同构成压迫感。";
      choicesEl.innerHTML = "";

      document.querySelector(".panel").classList.remove("ending-good", "ending-bad", "ending-weird");
      if (scene.ending) {
        document.querySelector(".panel").classList.add(`ending-${scene.ending}`);
      }

      const visibleChoices = scene.choices.filter((choice) => {
        const collectedWork = workItems[choice.next];
        if (collectedWork && state.items.includes(collectedWork)) return false;
        if (choice.item && /学长作品/.test(choice.item) && state.items.includes(choice.item)) return false;
        if (isVisitedStoryChoice(choice)) return false;
        if (nextSceneId === "corridor" && choice.next && state.corridorVisited.includes(choice.next)) return false;
        return true;
      });

      if (nextSceneId === "corridor" && !visibleChoices.length) {
        visibleChoices.push({ label: "走廊事件都经历过了，进入期末前一周", next: "preFinalWeek" });
      }
      if (nextSceneId !== "corridor" && !scene.ending && !visibleChoices.length) {
        visibleChoices.push({ label: "这段剧情已经走完，去走廊换一件事", next: "corridor" });
      }

      (accidentalWorkChoices[nextSceneId] || []).forEach((choice) => {
        const collectedWork = workItems[choice.next];
        const alreadyVisible = visibleChoices.some((visibleChoice) => visibleChoice.next === choice.next);
        if (isVisitedStoryChoice(choice)) return;
        if (collectedWork && !state.items.includes(collectedWork) && !alreadyVisible) {
          visibleChoices.push(choice);
        }
      });

      if (scene.ending && nextSceneId !== "seniorBlessing" && hasGlobalCompletion()) {
        visibleChoices.unshift({ label: "全局通关：查看学长寄语", next: "seniorBlessing" });
      }
      if (nextSceneId === "start" && hasGlobalCompletion()) {
        visibleChoices.unshift({ label: "全局通关：查看学长寄语", next: "seniorBlessing" });
      }

      visibleChoices.forEach((choice) => {

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = choice.label;
        button.addEventListener("click", () => choose(choice));
        choicesEl.appendChild(button);
      });

      updateStats();
    }

    function choose(choice) {
      if (choice.action === "reset") {
        reset();
        return;
      }

      if (choice.action === "returnFromLoan") {
        render(state.loanReturnScene || "corridor");
        return;
      }

      if (choice.action === "openFile") {
        openReader(choice.file);
        return;
      }

      if ((choice.effects?.money || 0) < 0 && state.money <= 0) {
        if (!state.loanUsed) {
          state.loanReturnScene = state.scene || "corridor";
          render("studentLoan");
        } else {
          render("finalBadMoney");
        }
        return;
      }

      if (choice.effects) {
        state.mind = clamp(state.mind + (choice.effects.mind || 0), 0, 100);
        state.money = clamp(state.money + (choice.effects.money || 0), 0, 600);
        state.dignity = clamp(state.dignity + (choice.effects.dignity || 0), 0, 100);
      }

      uniquePush(choice.item);
      recordChoice(choice);
      if (choice.next && workItems[choice.next]) {
        state.workReturnScene = state.scene || "corridor";
      }
      if (state.scene === "corridor" && choice.next && !workItems[choice.next]) {
        state.corridorVisited ||= [];
        uniquePushTo(state.corridorVisited, choice.next);
      }
      if (choice.action === "collectWorkReturn") {
        state.day += 1;
        render(state.workReturnScene || "corridor");
        return;
      }
      if (choice.action === "graduate") {
        render(graduationEnding());
        return;
      }
      state.day += 1;
      if (isVisitedStoryChoice(choice)) {
        render("corridor");
      } else {
        render(choice.next || "corridor");
      }
    }

    function applyLoan() {
      if (state.money > 100 || state.loanUsed || scenes[state.scene]?.ending) return;
      state.loanUsed = true;
      state.loanReturnScene = state.scene || "corridor";
      state.money = clamp(state.money + 300, 0, 600);
      state.dignity = clamp(state.dignity - 15, 0, 100);
      state.mind = clamp(state.mind - 5, 0, 100);
      uniquePush("贫困生");
      render("studentLoan");
    }

    function renderSeniorLetter() {
      return `
        <article class="letter-paper">
          <h2 class="letter-title">给学弟学妹的寄语</h2>
          <p class="letter-salute">亲爱的学弟学妹：</p>
          <p class="letter-intro">如果你打开了这款游戏，走完了主要结局线——地球人、摇表人、魅力走位、天道轮回、不是地球人、负债退学、自动低头、骚粉骑士的葬礼、抬头的人——那么我想以这些作品的创作者的身份，对你说几句话。</p>

          <section class="letter-section">
            <h3>第一句：你没有错。</h3>
            <p>你上课抬头了，但你看的是黑板，不是他的表。</p>
            <p>你交补课费了，但你心里一直觉得不对。</p>
            <p>你被他骂“你可蠢”“滚你娘嘞”“你可是地球人”，你生气、委屈、觉得自己是不是真的有问题。</p>
            <p>你没有问题。有问题的是那个站在讲台上、口袋里装着你的钱、手腕上晃着金表、连一道导数题都讲不清楚的人。</p>
          </section>

          <section class="letter-section">
            <h3>第二句：你不是一个人。</h3>
            <p>这些作品，全是我一个人写的。但里面每一个细节——金表、粉盔、安K拳、酒店补课、监考费咆哮、“你可讲理”“你可是地球人”——不是我编的，是我们那一届所有人一起经历的。</p>
            <p>我不是“学长代表”。我只是那个把大家的记忆写成文字的人。</p>
            <p>你经历的，我也经历过。你不孤独，我也不孤独。</p>
          </section>

          <section class="letter-section">
            <h3>第三句：你可以不原谅，但一定要走出来。</h3>
            <p>毕业那天，我删掉了他的微信。不是我原谅了他，是我决定不再让他占我的内存。</p>
            <p>你以后会考上大学、读研、工作、结婚、生子。你会遇见真正的老师——那些备课到深夜、批作业到凌晨、会因为你考好了而发自内心高兴的人。</p>
            <p>你会发现，安K那样的东西，不配叫“老师”。你会发现，你当年受过的那些委屈，不是你的错，也不是你的命。</p>
            <p>你可以恨他。但不要让他定义你的一生。</p>
          </section>

          <section class="letter-section">
            <h3>第四句：如果你有能力，不要让下一个“安K”继续站在讲台上。</h3>
            <p>我知道，举报很难。家长会说“多一事不如少一事”，学校会保他，教育局未必管，甚至你自己都会犹豫——“我真的要毁掉一个人的工作吗？”</p>
            <p>但我想告诉你：毁掉教育的不是举报的人，是那些站在讲台上却不配的人。</p>
            <p>如果你有能力、有证据、有勇气，去做你觉得对的事。如果你没有，也没关系。保护好自己，先活下去。</p>
            <p>但请记住：沉默是一种选择，不是一种义务。</p>
          </section>

          <section class="letter-section">
            <h3>第五句：我们赢了。</h3>
            <p>不是我们举报了他、打败了他。是我们没有变成他。</p>
            <p>我们没有变成那种收钱不办事、念答案不讲课、打学生不脸红的人。</p>
            <p>我们走过那条走廊，推开那扇门，坐在那个50多人的酒店标准间里，熬过了那个暑假。我们活着出来了。我们考上了大学。我们读了研。</p>
            <p>我们还在写段子、写小说、做游戏，把他的名字钉在每一个能看见的地方。</p>
            <p>他还在晃他的表，但我们再也不会抬头了。</p>
          </section>

          <div class="letter-signature">
            <p>你的学长</p>
            <p>若朝</p>
          </div>
        </article>
      `;
    }

    function openReader(file) {
      const work = workLibrary[file];
      if (!work) return;
      readerTitle.textContent = work.title;
      readerBody.innerHTML = "";
      if (work.type === "image") {
        const img = document.createElement("img");
        img.src = work.src;
        img.alt = work.title;
        readerBody.appendChild(img);
      } else {
        const pre = document.createElement("pre");
        pre.className = "reader-text";
        pre.textContent = work.content;
        readerBody.appendChild(pre);
      }
      readerBackdrop.classList.add("is-open");
      readerBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeReader() {
      readerBackdrop.classList.remove("is-open");
      readerBackdrop.setAttribute("aria-hidden", "true");
      readerBody.innerHTML = "";
    }

    function reset() {
      permanentAchievements = [...new Set([...permanentAchievements, ...state.achievements])];
      saveProgress();
      state = structuredClone(initialState);
      state.achievements = [...permanentAchievements];
      render("start");
    }

    function clearSave() {
      const confirmed = window.confirm("确定要清空所有存档吗？已解锁的结局、隐藏成就和通关寄语进度都会重置。");
      if (!confirmed) return;
      permanentAchievements = [];
      permanentEndings = [];
      try {
        localStorage.removeItem(progressStorageKey);
      } catch (error) {
        console.warn("Progress could not be cleared.", error);
      }
      state = structuredClone(initialState);
      render("start");
    }

    musicBtn.addEventListener("click", async () => {
      if (bgm.paused) {
        try {
          bgm.volume = 0.45;
          await bgm.play();
          musicBtn.textContent = "暂停 BGM";
        } catch (error) {
          musicBtn.textContent = "点击后再试一次";
        }
      } else {
        bgm.pause();
        musicBtn.textContent = "播放 BGM";
      }
    });

    resetBtn.addEventListener("click", reset);
    clearSaveBtn.addEventListener("click", clearSave);
    loanBtn.addEventListener("click", applyLoan);
    readerClose.addEventListener("click", closeReader);
    readerBackdrop.addEventListener("click", (event) => {
      if (event.target === readerBackdrop) closeReader();
    });
    loadProgress();
    render("start");
  </script>
</body>
</html>
